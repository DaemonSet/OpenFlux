name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v2.0.0-beta.1

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  android:
    name: Build and publish Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $RELEASE_TAG"
              exit 1
              ;;
          esac

          expected_version="${RELEASE_TAG#v}"
          actual_version="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p'               android/app/build.gradle
          )"

          if [ -z "$actual_version" ]; then
            echo "Could not read Android versionName"
            exit 1
          fi

          if [ "$actual_version" != "$expected_version" ]; then
            echo "Tag/version mismatch:"
            echo "  tag:         $RELEASE_TAG"
            echo "  expected:    $expected_version"
            echo "  versionName: $actual_version"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "Android versionName: $actual_version"
          echo "Commit: $(git rev-parse HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Build native OpenFlux ARM64 core
        run: ./android-native/build-openflux-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"

      - name: Build signed APKs
        env:
          BUILD_TYPE: release
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: GRADLE_BIN="$(command -v gradle)" ./build_android_app.sh

      - name: Verify native core is packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/OpenFlux-android-arm64-v8a-release.apk             | grep -Fq 'lib/arm64-v8a/libopenflux_native.so'

      - name: Verify APK signatures
        run: for apk in dist/OpenFlux-android-*-release.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"; done

      - name: Generate checksums
        run: cd dist && sha256sum OpenFlux-android-*-release.apk > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Android-${{ env.RELEASE_TAG }}
          path: |
            dist/OpenFlux-android-*-release.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/OpenFlux-android-*-release.apk \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "OpenFlux Android $RELEASE_TAG" \
            --notes "Experimental Android 8+ builds. Choose arm64-v8a for most modern phones, armeabi-v7a for older 32-bit ARM devices, x86/x86_64 for compatible emulators, or universal when unsure. If a debug build is installed, uninstall it once before installing this signed release; later release updates preserve app data."
